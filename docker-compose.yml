version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: db_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: librasquest_db
    ports:
      - "5432:5432"
    networks:
      - app-network
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: backend_librasquest
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: librasquest_db
      DB_USER: postgres
      DB_PASSWORD: admin
      DATABASE_URL: postgres://postgres:admin@postgres:5432/librasquest_db
    ports:
      - "8000:8000"
    networks:
      - app-network
    depends_on:
      - postgres
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    
    container_name: web_librasquest
    restart: always
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    networks:
      - app-network
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules # Pra evitar sobrescrever 
  
networks:
  app-network:
    driver: bridge
  
volumes:
  pgdata:

