version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: db_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: librasquest_db
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    networks:
      - app-network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d librasquest_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: backend_librasquest
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: librasquest_db
      DB_USER: postgres
      DB_PASSWORD: admin
      DATABASE_URL: postgres://postgres:admin@postgres:5432/librasquest_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-secret-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "8000:8000"
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./web
    
    container_name: web_librasquest
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_PREDICTION_WS_URL=ws://localhost:8000/ws/predict
    ports:
      - "3000:3000"
    networks:
      - app-network
    depends_on:
      - backend
  
networks:
  app-network:
    driver: bridge
  
volumes:
  pgdata:
